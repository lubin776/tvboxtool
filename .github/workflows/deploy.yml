name: Download and Extract ZIP

on:
  workflow_dispatch:  # 支持手动触发

jobs:
  download-and-extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # 允许推送提交回仓库

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 下载 ZIP 文件
        run: |
          curl -L -o package.zip \
            "https://mpimg.cn/down.php/f8a4c9a953f50ab56289fc270faf0ee3.zip"

      - name: 解压 ZIP 到仓库根目录
        run: |
          unzip -o package.zip -d .
          rm package.zip

      - name: 提交并推送更改
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 自动解压并更新文件"